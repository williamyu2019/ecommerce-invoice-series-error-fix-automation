<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="t d"><title id="t">Agent, core and human responsibilities</title><desc id="d">The original workflow used an external agent with business services. The offline demonstration includes only synthetic tools, state transitions, tracker checks and visible results.</desc><style>text{font-family:Arial,sans-serif;fill:#203044}.h{font-size:24px;font-weight:bold}.s{font-size:18px}.small{font-size:15px}.box{fill:#fff;stroke:#94a8ba;stroke-width:2}.core{fill:#e9f4ee;stroke:#37805b;stroke-width:2}</style><rect width="1080" height="580" fill="#fafbfd"/><text x="30" y="44" class="h">Original operation: AI agents + code + people</text><rect x="30" y="70" width="310" height="110" rx="8" class="box"/><text x="50" y="102" class="s">Human operator</text><text x="50" y="132" class="small">Rules, business decisions, exceptions,</text><text x="50" y="156" class="small">confirmations and outcome review</text><rect x="385" y="70" width="310" height="110" rx="8" class="box"/><text x="405" y="102" class="s">External Codex / Claude agent</text><text x="405" y="132" class="small">Tool orchestration, page interpretation,</text><text x="405" y="156" class="small">implementation and diagnosis</text><rect x="740" y="70" width="310" height="110" rx="8" class="box"/><text x="760" y="102" class="s">Business services</text><text x="760" y="132" class="small">Queue / accounts / portal / tracker</text><text x="760" y="156" class="small">Excluded from this offline package</text><text x="30" y="240" class="h">Reproducible subset: offline core simulation</text><rect x="30" y="275" width="230" height="130" rx="8" class="box"/><text x="48" y="310" class="s">Synthetic observations</text><text x="48" y="343" class="small">Identity, current order state,</text><text x="48" y="367" class="small">save and invoice receipts</text><path d="M265 340 H300" stroke="#37805b" stroke-width="3"/><rect x="305" y="275" width="210" height="130" rx="8" class="core"/><text x="323" y="310" class="s">Adapted state core</text><text x="323" y="343" class="small">Eligibility / saved series /</text><text x="323" y="367" class="small">one attempt / recovery</text><path d="M520 340 H550" stroke="#37805b" stroke-width="3"/><rect x="555" y="275" width="220" height="130" rx="8" class="core"/><text x="573" y="310" class="s">Adapted tracker guards</text><text x="573" y="343" class="small">Scope, row identity, date,</text><text x="573" y="367" class="small">conflict-safe mock writes</text><path d="M780 340 H810" stroke="#37805b" stroke-width="3"/><rect x="815" y="275" width="235" height="130" rx="8" class="box"/><text x="833" y="310" class="s">Visible results</text><text x="833" y="343" class="small">JSON state + evidence + logs</text><text x="833" y="367" class="small">HTML evaluation and inspection</text><text x="30" y="462" class="s">16 predeclared scenarios. No model calls, real browser, or live services.</text><text x="30" y="500" class="small">PASS means the required behavior matched, including safe refusal; it does not mean an invoice was issued.</text><text x="30" y="533" class="small">Synthetic confirmation cannot establish actual user provenance; business results are recorded separately.</text></svg>